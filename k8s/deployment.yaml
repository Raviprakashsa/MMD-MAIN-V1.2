apiVersion: apps/v1
kind: Deployment
metadata:
  name: mmdss-app
  labels:
    app: mmdss
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mmdss
  template:
    metadata:
      labels:
        app: mmdss
    spec:
      containers:
        - name: app
          image: myregistry/mmdss:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mmdss-secrets
                  key: DATABASE_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: mmdss-secrets
                  key: NEXTAUTH_SECRET
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
