name: CI - Integration Tests

on:
  push:
    branches: [ main, master, '**/chore/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: mongodb://localhost:27017/mmdss
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_RELEASE: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (use install to refresh lockfile when necessary)
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Wait for MongoDB
        run: npx wait-on tcp:localhost:27017 --timeout 60000

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          npm run migrate:status || true
          npm run migrate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start Next.js (production)
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
        run: |
          nohup npm run start > server.log 2>&1 &
          npx wait-on http://localhost:3000 --timeout 120000

      - name: Run Playwright tests
        run: npx playwright test --reporter=list
