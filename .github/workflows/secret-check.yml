name: CI Secret Check

on:
  push:
    branches: [ main, master, 'chore/**' ]
  workflow_dispatch: {}

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check NEXTAUTH_SECRET
        run: |
          if [ -z "${{ secrets.NEXTAUTH_SECRET }}" ]; then
            echo "ERROR: NEXTAUTH_SECRET is not set in repository secrets." >&2
            exit 1
          fi
          echo "NEXTAUTH_SECRET is set."
