version: '3.8'
services:
  mongo:
    image: mongo:6.0
    ports:
      - '27017:27017'
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=mongodb://mongo:27017/mmdss
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    depends_on:
      - mongo
    restart: unless-stopped
